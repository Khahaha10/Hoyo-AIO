name: hoyo_aio
description: "Unofficial HoYoverse companion app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  lucide_icons_flutter: ^4.0.3
  flutter_animate: ^4.5.2
  go_router: ^18.1.4
  crypto: ^3.0.8
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  logger: ^2.8.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_inappwebview: 6.2.0-beta.3
  url_launcher: ^6.3.3
  cryptography: ^2.9.0
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  riverpod_generator: ^4.0.10
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  riverpod_lint: ^3.2.0
  mocktail: ^1.0.5
  drift_dev: ^2.35.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/licenses/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
