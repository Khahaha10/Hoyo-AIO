name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.50.1

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed lib test

      - name: Codegen
        run: |
          flutter gen-l10n
          dart run build_runner build

      - name: Translation parity
        run: |
          cat build/untranslated_messages.json
          test "$(tr -d '[:space:]' < build/untranslated_messages.json)" = "{}"

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage --exclude-tags golden --timeout 60s

      - name: Coverage
        run: |
          sudo apt-get install -y -qq lcov
          lcov --quiet --ignore-errors unused \
            --remove coverage/lcov.info '**/*.g.dart' '**/*.freezed.dart' 'lib/core/l10n/generated/**' \
            'lib/core/database/tables.dart' \
            -o coverage/lcov.info
          lcov --summary coverage/lcov.info | tee coverage/summary.txt
          pct=$(grep -oP 'lines\.*: \K[0-9.]+' coverage/summary.txt)
          awk -v p="$pct" 'BEGIN { exit !(p >= 80) }' || { echo "Line coverage $pct% is below 80%"; exit 1; }

      - name: Build dev debug APK
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart

  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Codegen
        run: |
          flutter gen-l10n
          dart run build_runner build

      - name: Add widget extension target
        run: ruby ios/scripts/add_widget_extension.rb

      - name: Build iOS (no codesign)
        run: flutter build ios -t lib/main_prod.dart --no-codesign
