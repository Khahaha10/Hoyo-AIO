name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.50.1

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Codegen
        run: |
          flutter gen-l10n
          dart run build_runner build

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --flavor prod -t lib/main_prod.dart \
            --obfuscate --split-debug-info=build/debug-info
          cp build/app/outputs/flutter-apk/app-prod-release.apk \
            "hoyo-aio-${GITHUB_REF_NAME}.apk"
          sha256sum "hoyo-aio-${GITHUB_REF_NAME}.apk" > "hoyo-aio-${GITHUB_REF_NAME}.apk.sha256"

      - name: Keep symbols for crash decoding
        uses: actions/upload-artifact@v4
        with:
          name: debug-info-${{ github.ref_name }}
          path: build/debug-info
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            hoyo-aio-${{ github.ref_name }}.apk
            hoyo-aio-${{ github.ref_name }}.apk.sha256
